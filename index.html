<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Learning</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
  input, button, textarea { width: 100%; margin: 0.5rem 0; }
  #transcript, #summary, #chat { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; }
</style>
</head>
<body>

<h1>Learn from YouTube Video</h1>

<input type="text" id="url" placeholder="Enter YouTube URL">
<button id="submit">Start Learning</button>

<div id="status"></div>
<div id="accessLinkContainer" style="display:none;">
  <p>Access Link: <span id="accessLink"></span></p>
</div>

<div id="transcript" style="display:none;"></div>
<div id="summary" style="display:none;"></div>

<div id="chat" style="display:none;">
  <textarea id="question" placeholder="Ask a question about this video"></textarea>
  <button id="ask">Ask</button>
  <div id="chatAnswer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
