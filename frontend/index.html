<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with YT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Chat with YT</h1>
                <p>AI-powered transcription and Q&A for YouTube videos</p>
            </div>
        </div>

        <div class="card">
            <div class="input-group">
                <input 
                    type="text" 
                    id="youtubeUrl" 
                    placeholder="Paste YouTube URL or Access Link here..."
                    onkeypress="if(event.key==='Enter') handleSubmit()"
                >
                <select id="whisperModel" class="model-select">
                    <option value="tiny">Fast</option>
                    <option value="base" selected>Balanced</option>
                    <option value="medium">Best</option>
                </select>
                <button id="submitBtn" onclick="handleSubmit()">Submit</button>
            </div>
            <p style="text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 10px;">
                Enter a YouTube URL to process or paste an access link to view existing results
            </p>

            <div id="errorSection" class="hidden">
                <div class="error-box">
                    <span id="errorMessage"></span>
                    <button class="btn-small" onclick="retryProcessing()">Retry</button>
                </div>
            </div>

            <div id="statusSection" class="hidden">
                <div id="statusBox" class="status"></div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div id="resultsSection" class="hidden results">
                <div class="share-link">
                    <strong>Shareable Link:</strong> 
                    <span id="accessLink"></span>
                    <button class="btn-small" onclick="copyAccessLink()">Copy Link</button>
                </div>

                <h2 class="section-title">
                    <span>Summary</span>
                    <div class="action-buttons">
                        <button class="btn-small btn-secondary" onclick="copySummary()">Copy</button>
                        <button class="btn-small btn-secondary" onclick="downloadSummary()">Download</button>
                    </div>
                </h2>
                <div id="summaryBox" class="summary-box"></div>

                <h2 class="section-title">
                    <span>Full Transcript</span>
                    <div class="action-buttons">
                        <button class="btn-small btn-secondary" onclick="copyTranscript()">Copy</button>
                        <button class="btn-small btn-secondary" onclick="downloadTranscript()">Download</button>
                    </div>
                </h2>
                <div id="transcriptBox" class="transcript-box"></div>

                <div class="chat-section">
                    <h2 class="section-title">Ask Questions</h2>
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-group">
                        <input 
                            type="text" 
                            id="questionInput" 
                            placeholder="Ask a question about the video..."
                            onkeypress="if(event.key==='Enter') askQuestion()"
                        >
                        <button onclick="askQuestion()">Ask</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <h2 class="section-title">
                <span>Recent Videos</span>
                <button class="btn-small btn-secondary" onclick="clearHistory()">Clear All</button>
            </h2>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
