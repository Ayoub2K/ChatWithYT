<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with YT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-gradient-1: #1a1a2e;
            --bg-gradient-2: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --bg-card: #1f2937;
            --bg-secondary: #111827;
            --border: #374151;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header-content {
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dark-mode-toggle {
            display: none;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            padding: 15px 30px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .status.queued {
            background: #fff3cd;
            color: #856404;
        }

        .status.processing {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.done {
            background: #d4edda;
            color: #155724;
        }

        .status.failed {
            background: #f8d7da;
            color: #721c24;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 100%;
            animation: indeterminate 1.5s ease-in-out infinite;
        }

        @keyframes indeterminate {
            0% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(0%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .hidden {
            display: none;
        }

        .results {
            margin-top: 20px;
        }

        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .transcript-box, .summary-box {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
            white-space: pre-wrap;
            color: var(--text-primary);
        }

        .chat-section {
            margin-top: 30px;
        }

        .chat-messages {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
        }

        .message.user {
            background: #065f46;
            margin-left: 20%;
        }

        .message.assistant {
            background: var(--bg-card);
            margin-right: 20%;
            border: 1px solid var(--border);
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
            color: var(--primary);
        }

        .chat-input-group {
            display: flex;
            gap: 10px;
        }

        .share-link {
            background: #064e3b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
        }

        .share-link strong {
            color: #10b981;
        }

        .history-section {
            margin-top: 30px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .history-item:hover {
            transform: translateX(5px);
        }

        .history-item-info {
            flex: 1;
        }

        .history-item-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .history-item-date {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .error-box {
            background: #7f1d1d;
            color: #fecaca;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .timestamp {
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
        }

        .timestamp:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Chat with YT</h1>
                <p>AI-powered transcription and Q&A for YouTube videos</p>
            </div>
        </div>

        <div class="card">
            <div class="input-group">
                <input 
                    type="text" 
                    id="youtubeUrl" 
                    placeholder="Paste YouTube URL or Access Link here..."
                    onkeypress="if(event.key==='Enter') handleSubmit()"
                >
                <button id="submitBtn" onclick="handleSubmit()">Submit</button>
            </div>
            <p style="text-align: center; font-size: 14px; color: var(--text-secondary); margin-top: 10px;">
                Enter a YouTube URL to process or paste an access link to view existing results
            </p>

            <div id="errorSection" class="hidden">
                <div class="error-box">
                    <span id="errorMessage"></span>
                    <button class="btn-small" onclick="retryProcessing()">Retry</button>
                </div>
            </div>

            <div id="statusSection" class="hidden">
                <div id="statusBox" class="status"></div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div id="resultsSection" class="hidden results">
                <div class="share-link">
                    <strong>Shareable Link:</strong> 
                    <span id="accessLink"></span>
                    <button class="btn-small" onclick="copyAccessLink()">Copy Link</button>
                </div>

                <h2 class="section-title">
                    <span>Summary</span>
                    <div class="action-buttons">
                        <button class="btn-small btn-secondary" onclick="copySummary()">Copy</button>
                        <button class="btn-small btn-secondary" onclick="downloadSummary()">Download</button>
                    </div>
                </h2>
                <div id="summaryBox" class="summary-box"></div>

                <h2 class="section-title">
                    <span>Full Transcript</span>
                    <div class="action-buttons">
                        <button class="btn-small btn-secondary" onclick="copyTranscript()">Copy</button>
                        <button class="btn-small btn-secondary" onclick="downloadTranscript()">Download</button>
                    </div>
                </h2>
                <div id="transcriptBox" class="transcript-box"></div>

                <div class="chat-section">
                    <h2 class="section-title">Ask Questions</h2>
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-group">
                        <input 
                            type="text" 
                            id="questionInput" 
                            placeholder="Ask a question about the video..."
                            onkeypress="if(event.key==='Enter') askQuestion()"
                        >
                        <button onclick="askQuestion()">Ask</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card history-section">
            <h2 class="section-title">
                <span>Recent Videos</span>
                <button class="btn-small btn-secondary" onclick="clearHistory()">Clear All</button>
            </h2>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let currentAccessLink = null;
        let statusCheckInterval = null;
        let lastSubmittedUrl = null;

        // Initialize
        loadHistory();
        checkUrlForAccessLink();

        function checkUrlForAccessLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const link = urlParams.get('link');
            if (link) {
                document.getElementById('youtubeUrl').value = link;
                handleSubmit();
            }
        }

        function handleSubmit() {
            const input = document.getElementById('youtubeUrl').value.trim();
            
            if (!input) {
                showError('Please enter a YouTube URL or access link');
                return;
            }

            // Check if it's a YouTube URL or an access link
            if (input.includes('youtube.com') || input.includes('youtu.be')) {
                submitVideo();
            } else {
                // It's an access link - load directly
                loadSharedLink(input);
            }
        }

        async function loadSharedLink(accessLink) {
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Loading...';

            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('statusSection').classList.add('hidden');

            try {
                currentAccessLink = accessLink;
                const response = await fetch(`${API_BASE}/jobs/${currentAccessLink}/result`);
                
                if (!response.ok) {
                    throw new Error('Invalid access link or results not found');
                }

                const data = await response.json();

                if (data.status === 'done') {
                    document.getElementById('resultsSection').classList.remove('hidden');
                    document.getElementById('transcriptBox').textContent = data.transcript;
                    document.getElementById('summaryBox').textContent = data.summary;
                    document.getElementById('accessLink').textContent = currentAccessLink;
                    document.getElementById('chatMessages').innerHTML = '';
                } else if (data.status === 'processing' || data.status === 'queued') {
                    // Job still processing - start status check
                    document.getElementById('statusSection').classList.remove('hidden');
                    updateStatus(data.status);
                    startStatusCheck();
                } else if (data.status === 'failed') {
                    showError('This job failed to process: ' + (data.error || 'Unknown error'));
                } else {
                    showError('Job status: ' + data.status);
                }

            } catch (error) {
                showError('Error loading shared link: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit';
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('lightMode', isLight);
            document.querySelector('.dark-mode-toggle').textContent = isLight ? 'Toggle Dark Mode' : 'Toggle Light Mode';
        }

        function loadDarkModePreference() {
            const isLight = localStorage.getItem('lightMode') === 'true';
            if (isLight) {
                document.body.classList.add('light-mode');
                document.querySelector('.dark-mode-toggle').textContent = 'Toggle Dark Mode';
            } else {
                document.querySelector('.dark-mode-toggle').textContent = 'Toggle Light Mode';
            }
        }

        async function submitVideo() {
            const url = document.getElementById('youtubeUrl').value.trim();
            
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            lastSubmittedUrl = url;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loader"></span> Processing...';

            document.getElementById('errorSection').classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE}/jobs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                currentAccessLink = data.access_link;

                document.getElementById('statusSection').classList.remove('hidden');
                document.getElementById('resultsSection').classList.add('hidden');
                document.getElementById('chatMessages').innerHTML = '';

                updateStatus(data.status);
                startStatusCheck();

            } catch (error) {
                showError('Error submitting video: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Process Video';
            }
        }

        function retryProcessing() {
            if (lastSubmittedUrl) {
                document.getElementById('youtubeUrl').value = lastSubmittedUrl;
                submitVideo();
            }
        }

        function showError(message) {
            document.getElementById('errorSection').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }

        function startStatusCheck() {
            if (statusCheckInterval) clearInterval(statusCheckInterval);
            
            let progress = 0;
            const progressFill = document.getElementById('progressFill');

            statusCheckInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/jobs/${currentAccessLink}/status`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    updateStatus(data.status);

                    // Update progress bar
                    if (data.status === 'queued') {
                        progress = 10;
                    } else if (data.status === 'processing') {
                        progress = Math.min(progress + 5, 90);
                    } else if (data.status === 'done') {
                        progress = 100;
                    }
                    progressFill.style.width = progress + '%';

                    if (data.status === 'done' || data.status === 'failed') {
                        clearInterval(statusCheckInterval);
                        if (data.status === 'done') {
                            loadResults();
                        } else if (data.status === 'failed') {
                            showError('Processing failed. Please try again.');
                        }
                        document.getElementById('submitBtn').disabled = false;
                        document.getElementById('submitBtn').textContent = 'Process Video';
                    }
                } catch (error) {
                    console.error('Status check error:', error);
                    showError('Lost connection to server');
                    clearInterval(statusCheckInterval);
                    document.getElementById('submitBtn').disabled = false;
                    document.getElementById('submitBtn').textContent = 'Process Video';
                }
            }, 2000);
        }

        function updateStatus(status) {
            const statusBox = document.getElementById('statusBox');
            statusBox.className = `status ${status}`;
            
            const messages = {
                queued: 'Queued - Waiting to start...',
                processing: 'Processing - Downloading and transcribing video (this may take a few minutes)...',
                done: 'Complete - Results ready',
                failed: 'Failed - Something went wrong'
            };
            
            statusBox.textContent = messages[status] || status;
        }

        async function loadResults() {
            try {
                const response = await fetch(`${API_BASE}/jobs/${currentAccessLink}/result`);
                const data = await response.json();

                if (data.status === 'done') {
                    document.getElementById('resultsSection').classList.remove('hidden');
                    document.getElementById('transcriptBox').textContent = data.transcript;
                    document.getElementById('summaryBox').textContent = data.summary;
                    document.getElementById('accessLink').textContent = currentAccessLink;

                    // Save to history
                    saveToHistory(lastSubmittedUrl, currentAccessLink);
                }
            } catch (error) {
                showError('Error loading results: ' + error.message);
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById('questionInput');
            const question = questionInput.value.trim();

            if (!question) return;

            const chatMessages = document.getElementById('chatMessages');
            
            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerHTML = `<strong>You:</strong>${question}`;
            chatMessages.appendChild(userMsg);

            questionInput.value = '';
            questionInput.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/jobs/${currentAccessLink}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Add assistant message
                const assistantMsg = document.createElement('div');
                assistantMsg.className = 'message assistant';
                assistantMsg.innerHTML = `<strong>Assistant:</strong>${data.answer}`;
                chatMessages.appendChild(assistantMsg);

                chatMessages.scrollTop = chatMessages.scrollHeight;

            } catch (error) {
                showError('Error asking question: ' + error.message);
            } finally {
                questionInput.disabled = false;
                questionInput.focus();
            }
        }

        function copyAccessLink() {
            const link = document.getElementById('accessLink').textContent;
            copyToClipboard(link, 'Access link copied! Share this token with others.');
        }

        function copySummary() {
            const summary = document.getElementById('summaryBox').textContent;
            copyToClipboard(summary, 'Summary copied!');
        }

        function copyTranscript() {
            const transcript = document.getElementById('transcriptBox').textContent;
            copyToClipboard(transcript, 'Transcript copied!');
        }

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text).then(() => {
                alert(message);
            }).catch(err => {
                showError('Failed to copy: ' + err);
            });
        }

        function downloadSummary() {
            const summary = document.getElementById('summaryBox').textContent;
            downloadText(summary, 'summary.txt');
        }

        function downloadTranscript() {
            const transcript = document.getElementById('transcriptBox').textContent;
            downloadText(transcript, 'transcript.txt');
        }

        function downloadText(text, filename) {
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // History management
        function saveToHistory(url, accessLink) {
            const history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
            const entry = {
                url,
                accessLink,
                timestamp: new Date().toISOString(),
                title: url.includes('youtube.com') ? 'YouTube Video' : url
            };
            
            // Remove duplicates
            const filtered = history.filter(item => item.url !== url);
            filtered.unshift(entry);
            
            // Keep only last 10
            const trimmed = filtered.slice(0, 10);
            localStorage.setItem('videoHistory', JSON.stringify(trimmed));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
            const historyList = document.getElementById('historyList');
            
            if (history.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No recent videos</p>';
                return;
            }

            historyList.innerHTML = history.map(item => `
                <div class="history-item" onclick="loadFromHistory('${item.accessLink}')">
                    <div class="history-item-info">
                        <div class="history-item-title">${item.title}</div>
                        <div class="history-item-date">${new Date(item.timestamp).toLocaleString()}</div>
                    </div>
                    <button class="btn-small btn-secondary" onclick="event.stopPropagation(); deleteHistoryItem('${item.url}')">Delete</button>
                </div>
            `).join('');
        }

        function loadFromHistory(accessLink) {
            currentAccessLink = accessLink;
            loadResults();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteHistoryItem(url) {
            const history = JSON.parse(localStorage.getItem('videoHistory') || '[]');
            const filtered = history.filter(item => item.url !== url);
            localStorage.setItem('videoHistory', JSON.stringify(filtered));
            loadHistory();
        }

        function clearHistory() {
            if (confirm('Clear all history?')) {
                localStorage.removeItem('videoHistory');
                loadHistory();
            }
        }
    </script>
</body>
</html>
